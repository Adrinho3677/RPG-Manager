{% extends "base.html" %}
{% block title %}Criar conta · {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <h1>Criar conta</h1>
    <p class="muted">Monte fichas, mestre campanhas, organize suas sessões.</p>
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">Nome de usuário</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="field">
          <label for="confirm">Confirmar senha</label>
          <input type="password" id="confirm" name="confirm" required>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Criar conta</button>
    </form>
    <p class="muted small" style="margin-top:1rem">
      Já tem conta? <a href="{{ url_for('auth.login', next=request.args.get('next')) }}">Entrar</a>.
    </p>
  </div>
</div>
{% endblock %}
